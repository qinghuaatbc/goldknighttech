services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goldknight
      POSTGRES_PASSWORD: goldknight
      POSTGRES_DB: goldknightdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldknight -d goldknightdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://goldknight:goldknight@db:5432/goldknightdb?sslmode=disable
      JWT_SECRET: change-this-secret-in-production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
